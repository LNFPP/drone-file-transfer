name: Build Drone File Transfer (Mac)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (Apple Silicon + Intel)
        run: |
          swift build -c release --arch arm64 --arch x86_64
          echo "BIN=$(swift build -c release --arch arm64 --arch x86_64 --show-bin-path)" >> $GITHUB_ENV

      - name: Make the .app
        run: |
          APP="Drone File Transfer.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          # App icon: Resources/AppIcon.png (1024x1024) -> AppIcon.icns
          mkdir AppIcon.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s Resources/AppIcon.png --out AppIcon.iconset/icon_${s}x${s}.png >/dev/null
            sips -z $((s*2)) $((s*2)) Resources/AppIcon.png --out AppIcon.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns AppIcon.iconset -o "$APP/Contents/Resources/AppIcon.icns"
          cp "$BIN/DroneFileTransfer" "$APP/Contents/MacOS/DroneFileTransfer"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>DroneFileTransfer</string>
            <key>CFBundleIdentifier</key><string>com.lotshots.sorter</string>
            <key>CFBundleName</key><string>Drone File Transfer</string>
            <key>CFBundleDisplayName</key><string>Drone File Transfer</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>1.${GITHUB_RUN_NUMBER}</string>
            <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>NSPrincipalClass</key><string>NSApplication</string>
          </dict>
          </plist>
          PLIST
          sed -i '' 's/^          //' "$APP/Contents/Info.plist"
          plutil -lint "$APP/Contents/Info.plist"
          codesign --force --deep -s - "$APP"
          ditto -c -k --keepParent "$APP" DroneFileTransfer-mac.zip

      # Always-current download:
      # https://github.com/LNFPP/drone-file-transfer/releases/latest/download/DroneFileTransfer-mac.zip
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete build --yes --cleanup-tag || true
          gh release create build DroneFileTransfer-mac.zip --title "Drone File Transfer for Mac" --notes "build=${GITHUB_RUN_NUMBER} (${GITHUB_SHA::7})" --latest
